services:
  - type: web
    name: mvg-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGINS
        value: https://mvg-web.onrender.com,http://localhost:5173,http://127.0.0.1:5173

  - type: web
    name: mvg-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://mvg-api.onrender.com
